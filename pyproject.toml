[project]
name = "drl-hw3"
version = "0.1.0"
description = "DQN and DQN variants for DRL in Action GridWorld homework."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightning>=2.6.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "torch==2.5.1+cu121",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
